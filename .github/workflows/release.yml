name: Release

# Pushing a tag such as v0.2.0 publishes a GitHub Release: the tag is checked against package.json and CHANGELOG.md,
# the whole CI runs on Windows, macOS and Linux, and the release gets the exact .vsix that CI built and tested.
# Steps for maintainers: docs/RELEASING.md.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  notes:
    name: Check version and release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag matches package.json, and CHANGELOG.md has its section
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > release-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  ci:
    needs: notes
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish the GitHub Release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: owui-agent-vsix
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # A tag with a hyphen (v0.3.0-beta.1) is published as a pre-release.
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" ./*.vsix --verify-tag --title "OWUI Agent ${TAG#v}" --notes-file release-notes.md $prerelease
